name: CraftMaid
version: '${project.version}'
main: com.github.quantumxiaol.craftmaid.CraftMaid
api-version: '26.1.2'
softdepend: [Citizens, Sentinel, Denizen]
commands:
  craftmaid:
    description: "管理 CraftMaid 女仆插件"
    usage: "/<command> [help|version|spawn|hide|show|refresh|remove|reload|forget|follow|job|fishing|chunk|harvest|anchor|region|photo|vision]"
    aliases: [maid]
  follow:
    description: "控制 CraftMaid 女仆跟随"
    usage: "/<command> <start|stop>"
permissions:
  craftmaid.admin:
    description: "允许重载配置、生成/隐藏/刷新/删除 NPC、管理历史和准备视觉资源"
    default: op
  craftmaid.control:
    description: "允许控制女仆跟随、护卫、工作、装备、锚点和拍照"
    default: false
  craftmaid.view:
    description: "允许打开女仆菜单并查看状态"
    default: true
